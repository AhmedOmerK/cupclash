# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── H2 In-Memory Database (local dev only) ───────────────────────────────────
spring.datasource.url=jdbc:h2:mem:cupclashdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── H2 Web Console ───────────────────────────────────────────────────────────
# Access at: http://localhost:8080/h2-console
# JDBC URL to enter in the console: jdbc:h2:mem:cupclashdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# create-drop: builds all tables on startup, drops them on shutdown (perfect for dev)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# H2Dialect is auto-detected; no need to set explicitly
spring.jpa.open-in-view=false

# ─── App name ─────────────────────────────────────────────────────────────────
spring.application.name=CupClash
