<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${match.teamA.name} + ' vs ' + ${match.teamB.name} + ' — CupClash'">Match — CupClash</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0e1a;
            color: #e8eaf0;
            min-height: 100vh;
        }

        nav {
            background: #111827;
            border-bottom: 2px solid #1e3a5f;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }
        .logo { font-size: 1.4rem; font-weight: 700; color: #f5c518; text-decoration: none; letter-spacing: 1px; }
        .nav-links a { color: #9ca3af; text-decoration: none; margin-left: 1.5rem; font-size: 0.9rem; }
        .nav-links a:hover { color: #f5c518; }

        .container { max-width: 680px; margin: 3rem auto; padding: 0 1.5rem; }

        /* ── Back link ── */
        .back-link {
            display: inline-block;
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .back-link:hover { color: #f5c518; }

        /* ── Match header card ── */
        .match-card {
            background: #111827;
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .group-tag {
            display: inline-block;
            background: #1e3a5f;
            color: #f5c518;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            margin-bottom: 1.25rem;
        }

        .matchup {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .team-block { text-align: center; flex: 1; }
        .team-block .name { font-size: 1.4rem; font-weight: 700; color: #e8eaf0; }
        .team-block .elo  { font-size: 0.85rem; color: #6b7280; margin-top: 0.25rem; }
        .vs-divider       { font-size: 1.1rem; color: #374151; font-weight: 700; }

        /* ── Probability bars ── */
        .prob-section { margin-bottom: 0; }
        .prob-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
            font-size: 0.88rem;
        }
        .prob-label { width: 70px; color: #9ca3af; text-align: right; flex-shrink: 0; }
        .prob-bar-track {
            flex: 1;
            background: #1e2d3d;
            border-radius: 4px;
            height: 22px;
            overflow: hidden;
        }
        .prob-bar-fill {
            height: 100%;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            transition: width 0.6s ease;
        }
        .fill-a    { background: linear-gradient(90deg, #2563eb, #3b82f6); color: #fff; }
        .fill-draw { background: linear-gradient(90deg, #4b5563, #6b7280); color: #e5e7eb; }
        .fill-b    { background: linear-gradient(90deg, #dc2626, #ef4444); color: #fff; }

        /* ── Prediction form ── */
        .predict-card {
            background: #111827;
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 1.75rem 2rem;
        }
        .predict-card h2 {
            font-size: 1rem;
            color: #9ca3af;
            margin-bottom: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .outcome-options {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .outcome-option { flex: 1; }
        .outcome-option input[type="radio"] { display: none; }
        .outcome-option label {
            display: block;
            text-align: center;
            padding: 0.75rem 0.5rem;
            border: 2px solid #1e3a5f;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: #9ca3af;
            transition: all 0.2s;
        }
        .outcome-option input[type="radio"]:checked + label {
            border-color: #f5c518;
            color: #f5c518;
            background: #1a2640;
        }
        .outcome-option label:hover { border-color: #2d5a8e; color: #e8eaf0; }

        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background: #f5c518;
            color: #0a0e1a;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover { background: #e0b015; }
        .submit-btn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }

        /* ── Already predicted banner ── */
        .already-banner {
            background: #14532d;
            border: 1px solid #166534;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            color: #86efac;
            font-size: 0.95rem;
            text-align: center;
        }
    </style>
</head>
<body>

<nav>
    <a class="logo" href="/">⚽ CupClash</a>
    <div class="nav-links">
        <a href="/game">Game-by-Game</a>
        <a href="/bracket">Full Bracket</a>
    </div>
</nav>

<div class="container">

    <a class="back-link" href="/game">← Back to all matches</a>

    <!-- Match header -->
    <div class="match-card">
        <div class="group-tag" th:text="'GROUP ' + ${match.groupName}">GROUP A</div>

        <div class="matchup">
            <div class="team-block">
                <div class="name" th:text="${match.teamA.name}">Team A</div>
                <div class="elo"  th:text="'Elo ' + ${match.teamA.eloRating}">Elo 2000</div>
            </div>
            <div class="vs-divider">VS</div>
            <div class="team-block">
                <div class="name" th:text="${match.teamB.name}">Team B</div>
                <div class="elo"  th:text="'Elo ' + ${match.teamB.eloRating}">Elo 1900</div>
            </div>
        </div>

        <!-- Elo probability bars -->
        <div class="prob-section">
            <div class="prob-row">
                <span class="prob-label" th:text="${match.teamA.name}">Team A</span>
                <div class="prob-bar-track">
                    <div class="prob-bar-fill fill-a"
                         th:style="'width:' + ${prob.winAPercent()}"
                         th:text="${prob.winAPercent()}">55.0%</div>
                </div>
            </div>
            <div class="prob-row">
                <span class="prob-label">Draw</span>
                <div class="prob-bar-track">
                    <div class="prob-bar-fill fill-draw"
                         th:style="'width:' + ${prob.drawPercent()}"
                         th:text="${prob.drawPercent()}">22.0%</div>
                </div>
            </div>
            <div class="prob-row">
                <span class="prob-label" th:text="${match.teamB.name}">Team B</span>
                <div class="prob-bar-track">
                    <div class="prob-bar-fill fill-b"
                         th:style="'width:' + ${prob.winBPercent()}"
                         th:text="${prob.winBPercent()}">23.0%</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Prediction form (hidden if already predicted) -->
    <div class="predict-card" th:if="${!alreadyPredicted}">
        <h2>Your Prediction</h2>
        <form th:action="@{/game/predict}" method="post">
            <input type="hidden" name="matchId" th:value="${match.id}"/>

            <div class="outcome-options">
                <div class="outcome-option">
                    <input type="radio" id="opt-a" name="predictedOutcome" value="TEAM_A" required/>
                    <label for="opt-a" th:text="${match.teamA.name}">Team A</label>
                </div>
                <div class="outcome-option">
                    <input type="radio" id="opt-draw" name="predictedOutcome" value="DRAW"/>
                    <label for="opt-draw">Draw</label>
                </div>
                <div class="outcome-option">
                    <input type="radio" id="opt-b" name="predictedOutcome" value="TEAM_B"/>
                    <label for="opt-b" th:text="${match.teamB.name}">Team B</label>
                </div>
            </div>

            <button type="submit" class="submit-btn">Lock In Prediction</button>
        </form>
    </div>

    <!-- Already predicted banner -->
    <div class="already-banner" th:if="${alreadyPredicted}">
        ✓ You have already submitted a prediction for this match.
    </div>

</div>

</body>
</html>
